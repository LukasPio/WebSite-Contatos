name: Verificações React

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Ainda não há package-lock.json no primeiro commit; npm install gera o lockfile.
      - name: Instalar dependências
        run: npm install --no-audit --no-fund
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build
